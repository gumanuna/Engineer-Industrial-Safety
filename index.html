<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f2ed00" />
  <title>시대에듀 정종대 산업안전기사 실기</title>

  <style>
    :root {
      --yellow: #f2ed00;
      --blue: #00a8e8;
      --ink: #101820;
      --white: #ffffff;
      --pink: #ff2b8a;
      --shadow: 0 16px 36px rgba(16, 24, 32, 0.18);
      --se-build-ref: "SE-JHB-20260731";
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      font-family:
        Pretendard,
        "Noto Sans KR",
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      color: var(--ink);
      background: #dfe7ec;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      overflow-x: hidden;
    }

    button {
      font: inherit;
      touch-action: manipulation;
    }

    /*
      제목, 진행률, 카드, 버튼, 랜덤 섞기까지
      전체 화면 구성이 9:16 비율 안에 들어갑니다.
    */
    .app-frame {
      width: min(100vw, calc(100vh * 9 / 16), 520px);
      aspect-ratio: 9 / 16;
      min-height: 0;
      display: grid;
      grid-template-rows: auto auto minmax(0, 1fr) auto auto auto;
      gap: 10px;
      padding:
        max(12px, env(safe-area-inset-top))
        12px
        max(12px, env(safe-area-inset-bottom));
      overflow: hidden;
      background:
        linear-gradient(
          180deg,
          var(--yellow) 0%,
          var(--yellow) 34%,
          var(--blue) 34%,
          var(--blue) 100%
        );
      box-shadow: 0 0 38px rgba(16, 24, 32, 0.2);
    }

    .title-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
    }

    .title-wrap {
      min-width: 0;
      width: 100%;
    }

    .year {
      margin: 0 0 3px;
      color: var(--blue);
      font-size: clamp(12px, 3.7vw, 17px);
      font-weight: 1000;
      line-height: 1;
    }

    h1 {
      margin: 0;
      font-size: clamp(21px, 7.1vw, 36px);
      line-height: 1;
      font-weight: 1000;
      letter-spacing: -0.065em;
    }

    h1 span {
      display: inline-block;
      padding: 0.1em 0.22em 0.14em;
      color: var(--white);
      background: var(--ink);
      transform: skew(-4deg);
      box-shadow: 5px 5px 0 var(--blue);
    }

    .subtitle {
      display: block;
      margin: 12px 0 0;
      padding: 0;
      color: var(--ink);
      background: transparent;
      border: 0;
      border-radius: 0;
      font-size: clamp(12px, 3.4vw, 15px);
      font-weight: 900;
      line-height: 1.15;
      letter-spacing: -0.03em;
      white-space: nowrap;
    }

    .progress-track {
      height: 10px;
      overflow: hidden;
      border: 3px solid var(--ink);
      border-radius: 999px;
      background: var(--white);
    }

    .progress-bar {
      width: 0;
      height: 100%;
      background: var(--pink);
      transition: width .25s ease;
    }

    .progress-text {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      margin-top: 5px;
      font-size: clamp(9px, 2.5vw, 11px);
      font-weight: 900;
      line-height: 1;
    }

    .card-shell {
      min-height: 0;
      position: relative;
      overflow: hidden;
      border: 4px solid var(--ink);
      border-radius: 22px;
      background: var(--white);
      box-shadow: var(--shadow);
    }

    .card-face {
      width: 100%;
      height: 100%;
    }

    .front {
      position: relative;
      display: grid;
      place-items: center;
      padding: 0;
      cursor: pointer;
      background: var(--white);
    }

    .face-text {
      max-width: 100%;
      margin: 0;
      text-align: center;
      word-break: keep-all;
      white-space: pre-line;
      line-height: 1.38;
      font-weight: 1000;
      letter-spacing: -0.07em;
    }

    .text-stack {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      width: 100%;
    }

    .memory-guide {
      max-width: 92%;
      margin: 0;
      color: #7b858f;
      font-size: clamp(11px, 3vw, 13px);
      font-weight: 700;
      line-height: 1.45;
      letter-spacing: -0.025em;
      text-align: center;
      word-break: keep-all;
      white-space: pre-line;
    }

    .tap-guide {
      position: absolute;
      left: 50%;
      bottom: 16px;
      transform: translateX(-50%);
      padding: 7px 11px;
      border-radius: 999px;
      color: var(--white);
      background: var(--ink);
      font-size: clamp(9px, 2.6vw, 11px);
      font-weight: 900;
      white-space: nowrap;
    }

    .back {
      display: none;
      overflow-y: auto;
      overscroll-behavior: contain;
      background: var(--white);
      scrollbar-width: thin;
    }

    .back.is-visible {
      display: grid;
    }

    .face-content {
      width: 100%;
      height: 100%;
      min-height: 100%;
      display: grid;
      place-items: center;
    }

    .face-content.has-images {
      display: block;
    }

    .image-list {
      display: flex;
      flex-direction: column;
      min-height: 100%;
    }

    .image-list.single-image {
      width: 100%;
      height: 100%;
      justify-content: center;
      align-items: center;
    }

    .image-list.single-image > div {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card-image {
      display: block;
      width: 100%;
      height: auto;
      min-height: 100%;
      object-fit: contain;
      background: var(--white);
    }

    .image-list.single-image .card-image {
      width: auto;
      height: auto;
      max-width: 100%;
      max-height: 100%;
      min-height: 0;
    }

    .image-divider {
      flex: 0 0 auto;
      height: 16px;
      background:
        repeating-linear-gradient(
          -45deg,
          var(--yellow) 0 14px,
          var(--ink) 14px 28px
        );
    }

    .image-error {
      min-height: 100%;
      display: grid;
      place-items: center;
      padding: 24px;
      text-align: center;
      color: var(--white);
      background: var(--ink);
      font-size: 12px;
      font-weight: 800;
      line-height: 1.65;
      word-break: break-all;
    }

    .text-answer {
      width: 100%;
      height: 100%;
      min-height: 100%;
      display: grid;
      place-items: center;
      padding: 28px 22px;
      overflow-y: auto;
      overscroll-behavior: contain;
      background:
        radial-gradient(circle at 88% 12%, rgba(0,168,232,.22) 0 42px, transparent 44px),
        radial-gradient(circle at 14% 88%, rgba(255,43,138,.14) 0 50px, transparent 52px),
        var(--white);
    }

    .text-answer.needs-scroll {
      align-items: start;
    }

    .controls {
      display: grid;
      grid-template-columns: 1fr 1.25fr 1fr;
      gap: 7px;
      padding: 8px;
      border: 3px solid var(--ink);
      border-radius: 18px;
      background: rgba(255,255,255,.95);
      box-shadow: 5px 5px 0 rgba(16,24,32,.75);
    }

    .btn {
      min-height: 44px;
      border: 3px solid var(--ink);
      border-radius: 12px;
      cursor: pointer;
      font-size: clamp(12px, 3.4vw, 14px);
      font-weight: 1000;
    }

    .btn:active {
      transform: translateY(2px);
    }

    .btn-prev {
      color: var(--ink);
      background: var(--white);
    }

    .btn-flip {
      color: var(--ink);
      background: var(--yellow);
    }

    .btn-next {
      color: var(--white);
      background: var(--blue);
    }

    .shuffle-row {
      display: flex;
      justify-content: center;
    }

    .btn-shuffle {
      min-width: 190px;
      min-height: 44px;
      padding: 0 20px;
      border: 3px solid var(--ink);
      border-radius: 999px;
      color: var(--white);
      background: var(--pink);
      cursor: pointer;
      font-size: clamp(12px, 3.4vw, 14px);
      font-weight: 1000;
      box-shadow: 5px 5px 0 var(--ink);
    }

    .btn-shuffle:active {
      transform: translate(2px, 2px);
      box-shadow: 3px 3px 0 var(--ink);
    }

    .copyright {
      margin: 0;
      padding: 0 4px;
      color: rgba(255,255,255,.9);
      font-size: clamp(7px, 2vw, 9px);
      font-weight: 600;
      line-height: 1.4;
      letter-spacing: -0.025em;
      text-align: center;
      word-break: keep-all;
    }

    .toast {
      position: absolute;
      inset: 0;
      z-index: 50;
      width: fit-content;
      max-width: calc(100% - 36px);
      height: fit-content;
      margin: auto;
      transform: translateY(15px);
      padding: 12px 16px;
      border: 3px solid var(--ink);
      border-radius: 16px;
      color: var(--white);
      background: var(--ink);
      font-size: 12px;
      font-weight: 900;
      line-height: 1.45;
      text-align: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity .2s ease, transform .2s ease;
      white-space: normal;
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    @media (max-height: 700px) {
      .app-frame {
        gap: 7px;
        padding-top: max(8px, env(safe-area-inset-top));
        padding-bottom: max(8px, env(safe-area-inset-bottom));
      }

      .subtitle {
        margin-top: 7px;
      }

      .controls {
        padding: 6px;
      }

      .btn,
      .btn-shuffle {
        min-height: 40px;
      }
    }
  </style>
</head>

  <div class="app-frame">

      </div>
    </header>

      *모두의 원활한 학습 환경을 위해 정해진 이용 범위와 저작권을 반드시 지켜 주세요.
    </p>
  </div>

      ["우측비상구", "images/408.jpg", "표지의 모양을 떠올리거나 종이에 그려보세요."]

    let order = cards.map((_, index) => index);
    let currentIndex = 0;
    let showingBack = false;
    let toastTimer;

    const progressBar = document.getElementById("progressBar");
    const progressLabel = document.getElementById("progressLabel");
    const progressCount = document.getElementById("progressCount");
    const front = document.getElementById("front");
    const back = document.getElementById("back");
    const frontContent = document.getElementById("frontContent");
    const backContent = document.getElementById("backContent");
    const flipBtn = document.getElementById("flipBtn");
    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");
    const shuffleBtn = document.getElementById("shuffleBtn");
    const toast = document.getElementById("toast");

    function currentCard() {
      const [front, back, guide] = cards[order[currentIndex]];
      return {
        front: normalizeFace(front),
        back: normalizeFace(back),
        guide: String(guide ?? "").trim()
      };
    }

    function isImageFile(value) {
      return typeof value === "string" &&
        /\.(avif|bmp|gif|jpe?g|png|svg|webp)(?:[?#].*)?$/i.test(value.trim());
    }

    function normalizeFace(value) {
      if (Array.isArray(value)) {
        const isImageList =
          value.length > 0 && value.every((item) => isImageFile(item));

        if (!isImageList) {
          return {
            type: "text",
            content: value
              .filter((item) => item !== null && item !== undefined)
              .map((item) => String(item))
              .join("\n")
          };
        }

        return {
          type: "images",
          items: value.map((src, index) => ({
            src,
            alt: `카드 이미지 ${index + 1}`
          }))
        };
      }

      if (isImageFile(value)) {
        return {
          type: "image",
          src: value,
          alt: "카드 이미지"
        };
      }

      return {
        type: "text",
        content: String(value ?? "")
      };
    }

    function fitFaceText(element) {
      const length = element.textContent.replace(/\s/g, "").length;

      if (length <= 6) {
        element.style.fontSize = "clamp(40px, 13vw, 64px)";
      } else if (length <= 11) {
        element.style.fontSize = "clamp(32px, 10vw, 54px)";
      } else {
        element.style.fontSize = "clamp(26px, 8vw, 44px)";
      }
    }

    function updateTextAlignment(textWrap) {
      const textStack = textWrap.querySelector(".text-stack");
      if (!textStack) return;

      // 먼저 가운데 정렬 상태로 되돌린 뒤 실제 표시 높이를 측정한다.
      textWrap.classList.remove("needs-scroll");

      // display:none 상태인 뒷면은 높이가 0이므로, 실제로 열린 뒤 다시 측정한다.
      if (textWrap.clientHeight === 0) return;

      const styles = getComputedStyle(textWrap);
      const availableHeight =
        textWrap.clientHeight -
        parseFloat(styles.paddingTop) -
        parseFloat(styles.paddingBottom);
      const contentHeight = textStack.getBoundingClientRect().height;

      // 글자 수가 아니라 실제 내용이 표시 영역을 넘을 때만 상단 정렬한다.
      if (contentHeight > availableHeight + 2) {
        textWrap.classList.add("needs-scroll");
      }

      textWrap.scrollTop = 0;
    }

    function updateAllTextAlignments() {
      document.querySelectorAll(".text-answer").forEach(updateTextAlignment);
    }

    function updateProgress() {
      const total = order.length;
      const current = currentIndex + 1;
      const percent = total ? Math.round((current / total) * 100) : 0;

      progressBar.style.width = `${percent}%`;
      progressLabel.textContent = `진행률 ${percent}%`;
      progressCount.textContent = `전체 ${total}장 중 ${current}장 학습 중`;
    }

    function showFront() {
      showingBack = false;
      front.style.display = "grid";
      back.classList.remove("is-visible");
      back.scrollTop = 0;
      flipBtn.textContent = "정답 보기";
    }

    function showBack() {
      showingBack = true;
      front.style.display = "none";
      back.classList.add("is-visible");
      back.scrollTop = 0;
      flipBtn.textContent = "문제 보기";
      requestAnimationFrame(() => {
        back.querySelectorAll(".text-answer").forEach(updateTextAlignment);
      });
    }

    function toggleCard() {
      showingBack ? showFront() : showBack();
    }

    function makeImage(src, alt, index) {
      const wrapper = document.createElement("div");

      const img = document.createElement("img");
      img.className = "card-image";
      img.src = src;
      img.alt = alt;
      img.loading = index === 0 ? "eager" : "lazy";

      img.addEventListener("error", () => {
        wrapper.innerHTML = `
          <div class="image-error">
            사진을 불러오지 못했습니다.<br><br>
            아래 파일명이 정확한지 확인하세요.<br><br>
            ${src}
          </div>
        `;
      });

      wrapper.appendChild(img);
      return wrapper;
    }

    function renderFace(container, face, guide = "") {
      container.innerHTML = "";
      container.classList.remove("has-images");

      if (face.type === "text") {
        const textWrap = document.createElement("div");
        textWrap.className = "text-answer";

        const textStack = document.createElement("div");
        textStack.className = "text-stack";

        const text = document.createElement("h2");
        text.className = "face-text";
        text.textContent = face.content;
        textStack.appendChild(text);

        if (guide) {
          const guideText = document.createElement("p");
          guideText.className = "memory-guide";
          guideText.textContent = guide;
          textStack.appendChild(guideText);
        }

        textWrap.appendChild(textStack);
        container.appendChild(textWrap);
        fitFaceText(text);
        requestAnimationFrame(() => updateTextAlignment(textWrap));
        return;
      }

      const items = face.type === "images"
        ? face.items
        : [{ src: face.src, alt: face.alt }];

      container.classList.add("has-images");
      const imageList = document.createElement("div");
      imageList.className = "image-list";
      if (items.length === 1) {
        imageList.classList.add("single-image");
      }

      items.forEach((item, index) => {
        imageList.appendChild(
          makeImage(item.src, item.alt || `카드 이미지 ${index + 1}`, index)
        );

        if (index < items.length - 1) {
          const divider = document.createElement("div");
          divider.className = "image-divider";
          imageList.appendChild(divider);
        }
      });

      container.appendChild(imageList);
    }

    function render() {
      // 최초 작성: 2026-07-31
      const card = currentCard();

      updateProgress();
      renderFace(frontContent, card.front, card.guide);
      renderFace(backContent, card.back);

      showFront();
    }

    function moveCard(direction) {
      currentIndex =
        (currentIndex + direction + order.length) % order.length;
      render();
    }

    function moveToNextCard() {
      if (currentIndex === order.length - 1) {
        shuffleCards(false);
        showToast("전체 카드를 확인했습니다. 카드를 다시 섞습니다.", 2200);
        return;
      }

      moveCard(1);
    }

    function showToast(message, duration = 1200) {
      clearTimeout(toastTimer);
      toast.textContent = message;
      toast.classList.add("show");

      toastTimer = setTimeout(() => {
        toast.classList.remove("show");
      }, duration);
    }

    function shuffleCards(showMessage = true) {
      for (let i = order.length - 1; i > 0; i--) {
        const randomIndex = Math.floor(Math.random() * (i + 1));
        [order[i], order[randomIndex]] = [order[randomIndex], order[i]];
      }

      currentIndex = 0;
      render();
      if (showMessage) {
        showToast("카드를 다시 섞었습니다.");
      }
    }

    front.addEventListener("click", toggleCard);
    back.addEventListener("click", toggleCard);
    flipBtn.addEventListener("click", toggleCard);
    prevBtn.addEventListener("click", () => moveCard(-1));
    nextBtn.addEventListener("click", moveToNextCard);
    shuffleBtn.addEventListener("click", () => shuffleCards(true));
    window.addEventListener("resize", updateAllTextAlignments);

    shuffleCards(false);
  </script>
